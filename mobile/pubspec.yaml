name: gym_tracker
description: "Private, offline-first workout tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
  flutter: 3.47.7

dependencies:
  collection: 1.19.1
  crypto: 3.0.7
  dio: 5.11.1
  file_picker: 13.1.0
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  freezed_annotation: 3.1.0
  gal: 2.3.3
  go_router: 18.0.2
  image: 4.10.1
  image_picker: 1.2.3
  intl: 0.20.3
  json_annotation: 4.12.0
  lucide_icons_flutter: 3.1.20
  meta: 1.18.3
  package_info_plus: 10.2.1
  path: 1.9.1
  path_provider: 2.1.6
  share_plus: 13.3.0
  timezone: 0.11.2
  url_launcher: 6.3.2

dev_dependencies:
  alchemist: 0.14.0
  build_runner: 2.16.2
  flutter_test:
    sdk: flutter
  freezed: 4.0.2
  integration_test:
    sdk: flutter
  json_serializable: 6.14.1
  riverpod_lint: 3.1.9
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/seed/
    - assets/quotes/
    - assets/brand/
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
