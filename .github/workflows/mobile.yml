name: mobile

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build -d
          flutter gen-l10n
          (cd .. && dart design-tokens/tool/generate_theme.dart)
          git diff --exit-code
      - run: dart format --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: flutter test --coverage
      - name: Domain coverage of at least 85%
        run: |
          sudo apt-get install -y lcov > /dev/null
          lcov --extract coverage/lcov.info '*/domain/*' -o coverage/domain.info --ignore-errors unused
          lcov --remove coverage/domain.info '*.freezed.dart' '*.g.dart' -o coverage/domain.info --ignore-errors unused
          pct=$(lcov --summary coverage/domain.info | grep -oP 'lines\.*: \K[0-9.]+')
          echo "Domain line coverage: $pct%"
          awk -v p="$pct" 'BEGIN { exit (p >= 85) ? 0 : 1 }'

  android:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug --flavor dev --dart-define-from-file=config/dev.json
      - name: Kotlin layout parity
        working-directory: mobile/android
        run: ./gradlew :app:testDevDebugUnitTest
      - name: APK size
        run: ls -lh mobile/build/app/outputs/flutter-apk/

  ios:
    runs-on: macos-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --debug --no-codesign --dart-define-from-file=config/dev.json

  integration:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: mobile
          script: flutter test integration_test --flavor staging --dart-define-from-file=config/staging.json
