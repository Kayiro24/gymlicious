name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

      - name: Restore the upload keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are missing (see docs/releasing.md)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed app bundle and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --flavor prod --dart-define-from-file=config/prod.json
          flutter build apk --release --flavor prod --dart-define-from-file=config/prod.json
          mkdir -p "$RUNNER_TEMP/out"
          cp build/app/outputs/bundle/prodRelease/app-prod-release.aab "$RUNNER_TEMP/out/gymlicious-${GITHUB_REF_NAME}.aab"
          cp build/app/outputs/flutter-apk/app-prod-release.apk "$RUNNER_TEMP/out/gymlicious-${GITHUB_REF_NAME}.apk"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/out/*.aab
            ${{ runner.temp }}/out/*.apk
          generate_release_notes: true
